{% extends 'base.html' %}
{% block content %}
<section class="panel narrow">
  <h1>Account</h1>
  <img class="avatar" src="{{ current_user.avatar_url }}" alt="Your avatar">
  <form action="{{ url_for('account.upload_avatar') }}" method="post" enctype="multipart/form-data" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Avatar <input type="file" name="file" accept="image/png,image/jpeg,image/gif,image/webp" required></label>
    <button>Upload avatar</button>
  </form>
  <h2>Profile</h2>
  <form action="{{ url_for('account.update_profile') }}" method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Name <input name="username" value="{{ current_user.name }}" maxlength="48" required></label>
    <label>Email <input name="email" type="email" value="{{ current_user.email }}" required></label>
    <button>Save profile</button>
  </form>
  <h2>Password</h2>
  <form action="{{ url_for('account.update_password') }}" method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Current password <input name="current_password" type="password" autocomplete="current-password" required></label>
    <label>New password <input name="password" type="password" autocomplete="new-password" maxlength="72" required></label>
    <button>Change password</button>
  </form>
  <p>Two-factor authentication: {{ 'Enabled' if current_user.is_2fa_enabled else 'Disabled' }}</p>
  <a href="{{ url_for('auth.setup_otp') }}">Set up authenticator</a>
</section>
{% endblock %}
