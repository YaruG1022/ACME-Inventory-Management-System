{% macro icon(name, size=20) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icon">
{% if name == 'grid' %}<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{% elif name == 'box' %}<path d="m12 3 9 5v8l-9 5-9-5V8zM3 8l9 5 9-5M12 13v8M7.5 5.5l9 5"/>
{% elif name == 'receive' %}<path d="M4 14v6h16v-6M12 3v12m-4-4 4 4 4-4"/>
{% elif name == 'orders' %}<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v4H9zM9 12h6M9 16h4"/>
{% elif name == 'chart' %}<path d="M4 3v17h17M8 16v-5m5 5V7m5 9V4"/>
{% elif name == 'user' %}<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
{% elif name == 'arrow' %}<path d="M5 12h14m-5-5 5 5-5 5"/>
{% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name == 'alert' %}<path d="m12 3 10 18H2zM12 9v5m0 3v.2"/>
{% elif name == 'search' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>
{% elif name == 'logout' %}<path d="M9 4H4v16h5m5-4 4-4-4-4m-6 4h12"/>
{% elif name == 'leaf' %}<path d="M20 3C8 2 3 8 5 15c7 4 15 0 15-12ZM4 21 15 9"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif name == 'download' %}<path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/>
{% else %}<path d="M4 6h16M4 12h16M4 18h16"/>{% endif %}
</svg>
{%- endmacro %}
