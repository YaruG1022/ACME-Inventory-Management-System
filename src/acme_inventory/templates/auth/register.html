{% extends 'base.html' %}
{% block content %}
<section class="panel narrow">
  <h1>Create an account</h1>
  <form method="post" action="{{ url_for('auth.register') }}" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Name <input name="username" maxlength="48" autocomplete="name" required></label>
    <label>Email <input type="email" name="email" autocomplete="username" required></label>
    <label>Password <input type="password" name="password" maxlength="72" autocomplete="new-password" required></label>
    <button>Register</button>
  </form>
</section>
{% endblock %}
