[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acme-inventory"
version = "0.2.0"
description = "ACME Food Bank inventory tracking system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4", "Flask-SQLAlchemy>=3.1,<4",
  "Flask-Bcrypt>=1.0,<2", "Flask-Login>=0.6,<1",
  "pyotp>=2.9,<3", "qrcode[pil]>=7.4,<9", "Pillow>=10",
  "XlsxWriter>=3.1,<4", "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "build>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acme_inventory = ["templates/**/*.html", "templates/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
